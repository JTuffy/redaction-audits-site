  <script>
    // Served under a sub-path (e.g. /projects/redaction); relative URLs need the trailing slash.
    if (!location.pathname.endsWith("/") && !location.pathname.split("/").pop().includes(".")) {
      location.replace(location.pathname + "/" + location.search + location.hash);
    }
    // Theme before first paint: "light" or "dark" if chosen, otherwise follow the system.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
